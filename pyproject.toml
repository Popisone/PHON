[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phon"
version = "0.9.3"
description = "PHON - Phononic Orchestration Notation (open standard + reference implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PHON Project" }]
keywords = ["photonics", "dsl", "simulation", "gdsii", "ml-surrogate", "silicon-photonics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
ml = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "onnxruntime>=1.20",
    "onnx>=1.15",
    "skl2onnx>=1.16",
    "m2cgen>=0.10",
]
gds = [
    "gdstk>=0.9",
]
all = [
    "phon[dev,ml,gds]",
]

[project.urls]
Homepage = "https://github.com/Popisone/PHON"
Repository = "https://github.com/Popisone/PHON"
Issues = "https://github.com/Popisone/PHON/issues"
Changelog = "https://github.com/Popisone/PHON/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phon = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]